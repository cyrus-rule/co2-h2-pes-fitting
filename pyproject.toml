[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co2-h2-pes"
version = "0.1.0"
description = "Reproducible angular fitting tools for the CO2-H2 intermolecular PES"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

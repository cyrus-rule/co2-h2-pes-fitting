[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co2-h2-pes"
version = "0.3.0"
description = "Benchmark and integration pipeline for CO2-H2 PES fitting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4",
]

[project.scripts]
co2-h2-pes = "co2_h2_pes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
